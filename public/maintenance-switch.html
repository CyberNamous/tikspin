<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TikSpin · Maintenance</title>
<link rel="icon" type="image/png" href="/images/logo.png">
<meta name="theme-color" content="#0a0716">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<style>
:root{--bg:#0b0816;--panel:#16102a;--line:#33264f;--pink:#e58bff;--pink2:#d54bf0;--neon:#a23cf0;--text:#fff;--muted:#b3a9d9}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(900px 420px at 50% -8%,#2a1250 0%,var(--bg) 72%) no-repeat,var(--bg);color:var(--text);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;line-height:1.5;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));display:flex;justify-content:center}
main{width:100%;max-width:560px}
h1{font-size:1.4rem;margin:0 0 4px;color:var(--pink)}
.muted{color:var(--muted);font-size:.9rem}
a{color:var(--pink)}
</style>
</head>
<body>
<main>
  <h1>Maintenance</h1>
  <p class="muted">Owner only. Put TikSpin into maintenance for a set time, or turn it off early. You need your owner key. <a href="/">Back to TikSpin</a></p>
  <div id="mc"></div>
  <p class="muted">While maintenance is on, only the owner panel, this page, and the Terms and Privacy pages stay open.</p>
</main>
<script src="/maintenance-control.js"></script>
<script>MaintenanceControl.mount('#mc');</script>
</body>
</html>
