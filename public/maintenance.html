<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TikSpin · Under maintenance</title>
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="apple-touch-icon" href="/images/logo.png">
<meta name="theme-color" content="#0a0716">
<meta name="robots" content="noindex, nofollow">
<style>
:root{--bg:#0b0816;--panel:#16102a;--line:#33264f;--pink:#e58bff;--pink2:#d54bf0;--neon:#a23cf0;--text:#fff;--muted:#b3a9d9;--ok:#7be0a4}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;background:radial-gradient(900px 420px at 50% -8%,#2a1250 0%,var(--bg) 72%) no-repeat,var(--bg);color:var(--text);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;line-height:1.55;padding:calc(18px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom))}
main{flex:1;width:100%;max-width:520px;display:flex;align-items:center}
.card{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 22px;text-align:center}
.logo{width:64px;height:64px;border-radius:16px;object-fit:contain;background:#130f26;margin-bottom:14px}
h1{font-size:1.6rem;margin:0 0 8px;color:var(--pink)}
p{margin:8px 0;overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:.93rem}
.eta{display:inline-block;margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:8px 14px;background:#1d1636}
.status{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0 4px;color:var(--muted);font-size:.92rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pink2);animation:pulse 1.6s ease-in-out infinite}
.back .dot{background:var(--ok);animation:none}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.btn{display:inline-block;margin-top:14px;border:0;border-radius:12px;font:inherit;font-weight:800;padding:12px 22px;cursor:pointer;color:#fff;text-decoration:none;background:linear-gradient(135deg,var(--neon),var(--pink2))}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--pink)}
a{color:var(--pink)}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
[hidden]{display:none!important}
footer{width:100%;max-width:520px;text-align:center;color:var(--muted);font-size:.86rem;padding-top:14px}
footer a{margin:0 8px}
footer p{margin:6px 0 0}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<main>
  <div class="card" id="card">
    <img class="logo" src="/images/logo.png" alt="" width="64" height="64">
    <h1 id="title">TikSpin is under maintenance</h1>
    <p id="msg">We are making some improvements. Please check back soon.</p>
    <p id="eta" class="eta" hidden></p>
    <div class="status" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="st">We check again automatically.</span></div>
    <button class="btn" id="again" type="button">Check again</button>
    <a class="btn" id="open" href="/" hidden>Open TikSpin</a>
    <p class="muted" id="helpLine" hidden>Questions? <a id="mail" href="#"></a></p>
  </div>
</main>
<footer>
  <div><a href="/terms">Terms of Use</a><a href="/privacy">Privacy Policy</a></div>
  <p>TikSpin is an independent, free to use platform and is not affiliated with TikTok, Roblox or Mobile Legends.</p>
</footer>
<script>
const $=id=>document.getElementById(id);
const direct=location.pathname.replace(/\/+$/,'')==='/maintenance';   // opened on purpose, not shown in place of another page
const CHECK_MS=30000;
let timer=0;

function show(s){
  $('msg').textContent=s.message;
  const eta=$('eta'),late=s.until&&s.until<Date.now();
  if(s.until){
    eta.hidden=false;
    eta.textContent=late?'This is taking a little longer than expected.':'Expected back around '+new Date(s.until).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  }else eta.hidden=true;
  if(s.contact){$('helpLine').hidden=false;$('mail').textContent=s.contact;$('mail').href='mailto:'+s.contact}
}

function backUp(){
  $('card').classList.add('back');
  $('title').textContent='We are back';
  $('msg').textContent='TikSpin is open again.';
  $('eta').hidden=true;$('again').hidden=true;$('open').hidden=false;
  $('st').textContent='All done.';
  if(direct)return;
  // The address is the page the visitor wanted, so reloading brings it back. The guard stops a quick reload loop.
  let last=0;try{last=Number(sessionStorage.getItem('mntReload'))||0}catch{}
  if(Date.now()-last>10000){try{sessionStorage.setItem('mntReload',String(Date.now()))}catch{}setTimeout(()=>location.reload(),1200)}
  else timer=setTimeout(check,5000);
}

async function check(){
  clearTimeout(timer);
  $('st').textContent='Checking...';
  try{
    const r=await fetch('/api/sitemode/status',{cache:'no-store'});
    const s=await r.json();
    if(!s||!s.ok)throw new Error('bad');
    if(s.on){show(s);$('st').textContent='We check again automatically.';timer=setTimeout(check,CHECK_MS)}
    else backUp();
  }catch{
    $('st').textContent='Could not check just now. We will try again.';
    timer=setTimeout(check,CHECK_MS);
  }
}
$('again').addEventListener('click',check);
check();
</script>
<noscript><p class="muted" style="text-align:center">TikSpin is under maintenance. Please check back soon.</p></noscript>
</body>
</html>
